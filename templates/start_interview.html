{% extends "base.html" %}{% block content %}<div class="card"><h1>Start Interview</h1><p>Upload your resume and select the role to generate interview questions.</p><form method="POST" enctype="multipart/form-data"><label>Upload Resume PDF</label><input type="file" name="resume" accept=".pdf"><label>Job Role</label><select name="job_role" required><option value="python developer">Python Developer</option><option value="web developer">Web Developer</option><option value="data analyst">Data Analyst</option><option value="machine learning engineer">Machine Learning Engineer</option></select><label>Difficulty</label><select name="difficulty" required><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><button type="submit" class="btn">Generate Interview</button></form></div>{% endblock %}
