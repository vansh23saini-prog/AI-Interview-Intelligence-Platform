{% extends "base.html" %}{% block content %}<div class="auth-card"><h2>Create Account</h2><form method="POST"><label>Name</label><input type="text" name="name" placeholder="Enter your name" required><label>Email</label><input type="email" name="email" placeholder="Enter email" required><label>Password</label><input type="password" name="password" placeholder="Create password" required><button type="submit" class="btn full">Signup</button></form><p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
